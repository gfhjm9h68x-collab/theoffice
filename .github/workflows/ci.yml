name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -S error: fail only on hard errors (existing scripts may carry style warnings)
          shellcheck -S error bootstrap.sh scripts/*.sh
