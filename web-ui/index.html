<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Office — Mission Control</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a id="ui-switch" href="/mc/" title="Switch to the Mission Control redesign"
       style="position:fixed;top:10px;right:12px;z-index:99999;font:600 12px/1 system-ui,sans-serif;
              text-decoration:none;color:#9aa4b2;background:rgba(127,127,127,.16);
              border:1px solid rgba(127,127,127,.3);border-radius:7px;padding:6px 10px;">Mission Control &#8594;</a>
    <header>
      <h1>The Office <span class="sub">mission control</span></h1>
      <div id="tokrow" class="tokrow">
        <input id="token" type="password" placeholder="dashboard API token" />
        <button id="save">Connect</button>
        <span id="conn" class="muted"></span>
        <button id="emergency-btn" onclick="emergencyRestart(this)" title="Save the whole queue, wipe it, restart every agent, and have Michael brief you"
                style="margin-left:auto;background:#dc2626;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer">
          🚨 Emergency Restart
        </button>
      </div>
    </header>

    <main>
      <section id="overview" class="cards"></section>

      <nav class="tabs">
        <button data-tab="agents" class="active">Agents</button>
        <button data-tab="memories">Memory</button>
        <button data-tab="kanban">Kanban</button>
        <button data-tab="schedules">Schedules</button>
        <button data-tab="queue">Queue</button>
        <button data-tab="messages">Messages</button>
        <button data-tab="usage">Usage</button>
        <button data-tab="logs">Logs</button>
        <button data-tab="updates">⟳ Update</button>
      </nav>

      <section id="panel"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
